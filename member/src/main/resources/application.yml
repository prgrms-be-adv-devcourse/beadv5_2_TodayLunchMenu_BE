spring:
  application:
    name: member-service
  config:
    import:
      - "configserver:${CONFIG_SERVER_URL:http://localhost:8888}"
  cloud:
    config:
      fail-fast: true
      retry:
        initial-interval: 1000
        max-attempts: 20
        max-interval: 5000
        multiplier: 1.5
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/goods_mall?currentSchema=member
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_schema: member
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # --- Kafka 설정 (로컬 기본값) ---
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        spring.json.add.type.headers: false

server:
  port: 8083

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

apigateway:
  host: http://localhost:8080

jwt:
  secret: ${JWT_SECRET_KEY:local-dev-secret-key-for-testing-purposes-only-32chars}
  issuer: member-service
  access-expiration: 3600000
  refresh-expiration: 604800000

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:todaylunch-local}
    region: ap-northeast-2
    access-key: ${AWS_ACCESS_KEY_ID:test-access-key}
    secret-key: ${AWS_SECRET_ACCESS_KEY:test-secret-key}
    profile-image-prefix: members/profile
    put-presign-expiration-seconds: 300
    get-presign-expiration-seconds: 600

# --- Member Kafka Topic 설정 (로컬 기본값) ---
member:
  email:
    provider: ${EMAIL_PROVIDER:logging}
    from-address: ${MAIL_FROM:no-reply@todaylunch.local}
    from-name: ${MAIL_FROM_NAME:TodayLunch}
  email-verification:
    expiration: 24h
    frontend-confirm-url: ${EMAIL_VERIFICATION_FRONTEND_URL:http://localhost:3000/email-verification}
  seller-auto-promotion:
    delay: ${SELLER_AUTO_PROMOTION_DELAY:10m}
    poll-interval: ${SELLER_AUTO_PROMOTION_POLL_INTERVAL:30s}
    lock-ttl: ${SELLER_AUTO_PROMOTION_LOCK_TTL:30s}
    pending-ttl: ${SELLER_AUTO_PROMOTION_PENDING_TTL:24h}
  kafka:
    topic:
      signed-up: member-signed-up

logging:
  level:
    com.example.member: DEBUG
    org.hibernate.SQL: DEBUG
